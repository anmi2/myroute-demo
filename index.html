</style></head><body><div class="shell"><header class="bar"><div><small>NextGuess / 独立デモ</small><h1>マイルート</h1></div><button class="iconbtn" id="calendarBtn">▦ カレンダー</button></header><section class="datebar"><div><strong id="dateTitle"></strong> <span class="status" id="status"></span></div><button id="menuBtn">☰ メニュー</button></section><div class="key">時間軸をクリックして予定追加 / 枠の中央をドラッグして移動 / 上下端で時間調整</div><main class="main" id="main"><div class="timeline" id="timeline"></div></main><footer class="bottom"><button id="eventBtn">イベント</button><button id="recordBtn">営業実績</button><button class="danger" id="deleteBtn" style="display:none">予定を削除</button></footer><aside class="panel" id="panel"><div class="panelhead"><h2 id="panelTitle"></h2><button id="closePanel" aria-label="閉じる">×</button></div><div class="panelbody" id="panelBody"></div></aside><div class="toast" id="toast"><span id="toastText"></span><button id="undoBtn">元に戻す</button></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),HOUR=88,STEP=HOUR/4,STORE='myroute_web_demo_v1',SETTINGS_KEY='myroute_web_demo_settings_v2',VENUES=['京セラドーム大阪','大阪城ホール','Panasonic Stadium Suita','Asueアリーナ大阪','大浜だいしんアリーナ','おおきにアリーナ舞洲','インテックス大阪','YANMAR HANASAKA STADIUM','フェニーチェ堺','グランキューブ大阪','オリックス劇場','ザ・フェニックスホール','Zepp Osaka Bayside','Zepp Namba','GORILLA HALL OSAKA','フェスティバルホール','ザ・シンフォニーホール','NHK大阪ホール','ヤンマースタジアム長居','万博記念公園'];const pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,at=(k,h,m=0)=>new Date(`${k}T00:00:00`).getTime()+((h*60+m)*60000),fmt=t=>{const d=new Date(t);return `${pad(d.getHours())}:${pad(d.getMinutes())}`},short=(t,k)=>`${key(new Date(t))!==k?'翌 ':''}${fmt(t)}`,daytitle=k=>{const d=new Date(k+'T00:00:00');return `${d.getMonth()+1}月${d.getDate()}日 (${['日','月','火','水','木','金','土'][d.getDay()]})`};let defaultSettings={shiftName:'隔日勤務',startTime:'15:00',endTime:'08:00'};try{defaultSettings={...defaultSettings,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch(_){}let today=key(new Date()),chosen=today,plans={},active=null,undo=null,calendarMonth=new Date().getMonth(),calendarYear=new Date().getFullYear(),panelName='',toastTimer=null,blockClicks=0;try{plans=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(_){}const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(plans))}catch(_){}},fresh=k=>{const [sh,sm]=defaultSettings.startTime.split(':').map(Number),[eh,em]=defaultSettings.endTime.split(':').map(Number);const start=at(k,sh,sm),end=at(k,eh+(eh*60+em<=sh*60+sm?24:0),em);return{start,end,actualStart:start,actualEnd:end,workMinutes:Math.round((end-start)/60000),revenue:'',complete:false,items:[],selectedEvents:[]}},events=k=>VENUES.map((v,i)=>{const start=at(k,14+(i%12),((i%3)*15));return{id:i,venue:v,title:['公演・コンサート','スポーツイベント','展示・催事','ライブイベント'][i%4],start,end:start+(1+(i%3))*3600000}});function seed(){if(Object.keys(plans).length)return;const d=new Date(today+'T00:00:00'),prev=new Date(d);prev.setDate(d.getDate()-2);const pkey=key(prev);plans[pkey]=fresh(pkey);plans[pkey].items=[{id:'seed1',text:'梅田周辺で営業',start:at(pkey,17),end:at(pkey,19)},{id:'seed2',text:'休憩',start:at(pkey,18),end:at(pkey,18,30)}];plans[pkey].selectedEvents=[2,4];const done=new Date(d);done.setDate(d.getDate()-4);const dk=key(done);plans[dk]=fresh(dk);plans[dk].items=[{id:'seed3',text:'新大阪駅周辺',start:at(dk,16),end:at(dk,20)}];plans[dk].selectedEvents=[1,5];plans[dk].revenue='45000';plans[dk].complete=true;save()}seed();function get(){return plans[chosen]||null}function ensure(){return plans[chosen]||(plans[chosen]=fresh(chosen),save(),plans[chosen])}function bounds(p){return [p.start-3600000,p.end+3600000]}function timelineScroll(t){const p=get();if(!p)return;const [a]=bounds(p);$('main').scrollTop=Math.max(0,((t-a)/3600000)*HOUR-150)}function showInitial(){const p=get();if(!p)return;const [a,b]=bounds(p),now=Date.now();$('main').scrollTop=Math.max(0,(now>=a&&now<=b?(now-a)/3600000*HOUR-120:now>b?(b-a)/3600000*HOUR-500:0))}function overlappingLayout(items){const arr=items.map(x=>({...x})).sort((a,b)=>a.start-b.start||a.end-b.end);const groups=[];for(const x of arr){let g=groups.find(g=>x.start<g.maxEnd);if(!g){g={items:[],maxEnd:x.end};groups.push(g)}g.items.push(x);g.maxEnd=Math.max(g.maxEnd,x.end)}const out={};for(const g of groups){const columns=[];for(const x of g.items){let c=columns.findIndex(end=>end<=x.start);if(c<0){c=columns.length;columns.push(x.end)}else columns[c]=x.end;out[x.id]={col:c,count:0}}for(const x of g.items)out[x.id].count=columns.length}return out}function render(){const p=get();$('dateTitle').textContent=daytitle(chosen);$('status').textContent=!p?'未作成':p.complete?'完了済み':'作成中';$('deleteBtn').style.display=active&&p?.items.some(x=>x.id===active)?'':'none';const el=$('timeline');el.replaceChildren();if(!p){el.innerHTML='<div style="padding:26px;text-align:center;color:#688">この日のマイルートは未作成です。<br><br><button class="wide" id="makeRoute">マイルートを作成</button></div>';$('makeRoute').onclick=()=>{ensure();render();showInitial()};return}const [a,b]=bounds(p),hours=(b-a)/3600000;el.style.height=`${hours*HOUR}px`;for(let i=0;i<=hours;i++){const row=document.createElement('div');row.className='hour';row.innerHTML=`<time>${short(a+i*3600000,chosen)}</time><div class="line"></div>`;el.append(row)}const track=document.createElement('div');track.className='track';el.append(track);for(const ev of events(chosen).filter(x=>p.selectedEvents.includes(x.id)&&x.end>a&&x.start<b)){const div=document.createElement('div');div.className='event-bg';div.style.top=`${Math.max(0,(ev.start-a)/3600000*HOUR)}px`;div.style.height=`${(Math.min(b,ev.end)-Math.max(a,ev.start))/3600000*HOUR}px`;div.textContent=`${ev.venue} ${ev.title}`;track.append(div)}const visible=p.items.filter(x=>x.end>a&&x.start<b),layout=overlappingLayout(visible);for(const item of visible){const info=layout[item.id],div=document.createElement('div');div.className='block'+(active===item.id?' selected':'');div.dataset.id=item.id;div.style.top=`${(Math.max(a,item.start)-a)/3600000*HOUR}px`;div.style.height=`${Math.max(22,(Math.min(b,item.end)-Math.max(a,item.start))/3600000*HOUR)}px`;div.style.left=`calc(${(info.col/info.count)*100}% + 2px)`;div.style.width=`calc(${100/info.count}% - 4px)`;div.style.zIndex=active===item.id?'10':'3';const overlap=events(chosen).some(ev=>p.selectedEvents.includes(ev.id)&&ev.start<item.end&&ev.end>item.start);div.innerHTML=`<div class="handle" data-action="start">⋯</div><div class="content" data-action="move">${overlap?'<span class="flag">イベント開催中</span>':''}<input aria-label="予定内容" placeholder="予定を入力" value=""></div><div class="handle" data-action="end">⋯</div>`;const inp=div.querySelector('input');inp.value=item.text;inp.addEventListener('pointerdown',e=>e.stopPropagation());inp.onfocus=()=>{active=item.id;$('deleteBtn').style.display='';div.classList.add('selected')};inp.oninput=()=>{item.text=inp.value;save()};inp.onblur=()=>save();div.addEventListener('pointerdown',e=>dragBegin(e,item,div));track.append(div)}track.addEventListener('click',e=>{if(e.target!==track)return;const rect=track.getBoundingClientRect(),mins=Math.round(((e.clientY-rect.top)/HOUR*60)/15)*15;const start=Math.max(a,Math.min(b-3600000,a+mins*60000));const item={id:'r'+Date.now()+Math.floor(Math.random()*10000),text:'',start,end:start+3600000};p.items.push(item);active=item.id;save();render();const inp=document.querySelector(`.block[data-id="${item.id}"] input`);inp?.focus()});}
function dragBegin(e,item,el){if(e.target.tagName==='INPUT')return;const action=e.target.dataset.action||'move';if(e.button!==0)return;e.preventDefault();e.stopPropagation();active=item.id;const y0=e.clientY,s0=item.start,e0=item.end,p=get();let didMove=false;el.setPointerCapture(e.pointerId);el.classList.add('selected');$('deleteBtn').style.display='';function move(ev){const steps=Math.round((ev.clientY-y0)/STEP),delta=steps*900000;didMove=didMove||Math.abs(ev.clientY-y0)>3;if(action==='start')item.start=Math.min(e0-900000,s0+delta);else if(action==='end')item.end=Math.max(s0+900000,e0+delta);else{item.start=s0+delta;item.end=e0+delta}const [a,b]=bounds(p);el.style.top=`${(Math.max(a,item.start)-a)/3600000*HOUR}px`;el.style.height=`${Math.max(22,(Math.min(b,item.end)-Math.max(a,item.start))/3600000*HOUR)}px`}function end(){el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end);save();if(didMove)render()}el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}function openPanel(name){panelName=name;$('panel').classList.add('show');$('panelTitle').textContent={calendar:'月間カレンダー',events:'イベント一覧',record:'営業実績',menu:'マイルート設定'}[name];const box=$('panelBody');box.replaceChildren();if(name==='calendar')return renderCalendar();if(name==='events')return renderEvents();if(name==='record')return renderRecord();if(name==='menu')return renderSettings()}function closePanel(){$('panel').classList.remove('show');panelName=''}function renderCalendar(){const b=$('panelBody');const d=new Date(calendarYear,calendarMonth,1),days=new Date(calendarYear,calendarMonth+1,0).getDate(),offset=d.getDay();b.innerHTML=`<div class="calendarhead"><button id="prevMonth">‹</button><strong>${calendarYear}年 ${calendarMonth+1}月</strong><button id="nextMonth">›</button></div><div class="cal" id="calendar"></div><p class="hint">緑：作成中　青：完了済み　無印：未作成。日付を押してマイルートへ移動します。</p>`;const cal=$('calendar');['日','月','火','水','木','金','土'].forEach(w=>{const x=document.createElement('div');x.className='weekday';x.textContent=w;cal.append(x)});for(let i=0;i<offset;i++)cal.append(document.createElement('div'));for(let i=1;i<=days;i++){const k=`${calendarYear}-${pad(calendarMonth+1)}-${pad(i)}`,btn=document.createElement('button');btn.textContent=i;btn.className=(k===chosen?'current ':'')+(plans[k]?(plans[k].complete?'complete':'draft'):'');btn.onclick=()=>{chosen=k;active=null;closePanel();render();showInitial()};cal.append(btn)}$('prevMonth').onclick=()=>{const x=new Date(calendarYear,calendarMonth-1,1);calendarYear=x.getFullYear();calendarMonth=x.getMonth();renderCalendar()};$('nextMonth').onclick=()=>{const x=new Date(calendarYear,calendarMonth+1,1);calendarYear=x.getFullYear();calendarMonth=x.getMonth();renderCalendar()}}
function renderEvents(){const p=get();const b=$('panelBody');if(!p){b.innerHTML='<p>マイルートを先に作成してください。</p>';return}const [a,c]=bounds(p);b.innerHTML='<p class="hint">対象20施設の仮イベント。タップで登録・解除できます。追加時は自動でタイムラインに戻ります。</p>';for(const ev of events(chosen).filter(x=>x.start<c&&x.end>a)){const selected=p.selectedEvents.includes(ev.id),btn=document.createElement('button');btn.className='eventitem'+(selected?' selected':'');btn.innerHTML=`<strong>${selected?'✓ ':''}${ev.venue}</strong><span>${short(ev.start,chosen)}–${short(ev.end,chosen)} / ${ev.title}</span>`;btn.onclick=()=>{if(selected)p.selectedEvents=p.selectedEvents.filter(x=>x!==ev.id);else p.selectedEvents.push(ev.id);save();closePanel();render();timelineScroll(ev.start)};b.append(btn)}}function inputRow(b,label,value,type='text'){const div=document.createElement('label');div.className='field';div.textContent=label;const input=document.createElement('input');input.type=type;input.value=value;div.append(input);b.append(div);return input}function datetimeLocal(t){const d=new Date(t);return`${key(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`}function renderSettings(){const b=$('panelBody'),p=get();b.innerHTML='<h3>基本設定</h3><p class="hint">通常の勤務時刻を一度登録します。変更後に作成するマイルートへ適用され、作成済みの記録は変更しません。</p>';const shift=inputRow(b,'勤務区分（任意の名称）',defaultSettings.shiftName),start=inputRow(b,'基本出庫時刻',defaultSettings.startTime,'time'),end=inputRow(b,'基本帰庫時刻',defaultSettings.endTime,'time');const saveBtn=document.createElement('button');saveBtn.className='wide';saveBtn.textContent='基本設定を保存';saveBtn.onclick=()=>{if(!start.value||!end.value||start.value===end.value){alert('出庫・帰庫時刻を確認してください');return}defaultSettings={shiftName:shift.value.trim()||'通常勤務',startTime:start.value,endTime:end.value};localStorage.setItem(SETTINGS_KEY,JSON.stringify(defaultSettings));showToast('基本設定を保存しました',false)};b.append(saveBtn);if(p){const title=document.createElement('h3');title.textContent='表示中の日付の予定時刻';b.append(title);const hint=document.createElement('p');hint.className='hint';hint.textContent='この日だけ予定を変更できます。営業実績の営業時間は別項目として保持されます。';b.append(hint);const st=inputRow(b,'予定出庫日時',datetimeLocal(p.start),'datetime-local'),en=inputRow(b,'予定帰庫日時',datetimeLocal(p.end),'datetime-local');const b2=document.createElement('button');b2.className='wide';b2.textContent='この日の予定時刻を変更';b2.onclick=()=>{const a=Date.parse(st.value),z=Date.parse(en.value);if(!Number.isFinite(a)||!Number.isFinite(z)||z<=a){alert('予定時刻を確認してください');return}p.start=a;p.end=z;save();closePanel();render();showInitial()};b.append(b2)}const info=document.createElement('p');info.className='hint';info.textContent='既存のNextGuess、API、他のデモには接続していません。このブラウザにデータを保存します。';b.append(info)}
function renderRecord(){const p=get(),b=$('panelBody');if(!p){b.textContent='先にマイルートを作成してください。';return}b.innerHTML='<p class="hint">基本設定の勤務時間を初期値にしています。記録したい営業時間だけ修正できます。出庫・帰庫日時の入力は不要です。</p>';const minutes=Number.isFinite(p.workMinutes)?p.workMinutes:Math.max(0,Math.round(((p.actualEnd??p.end)-(p.actualStart??p.start))/60000));const hr=inputRow(b,'営業時間（時間）',String(Math.floor(minutes/60)),'number'),mi=inputRow(b,'営業時間（分）',String(minutes%60),'number'),revenue=inputRow(b,'営業収入（円）',String(p.revenue),'number');hr.min='0';hr.max='48';hr.step='1';mi.min='0';mi.max='59';mi.step='1';revenue.min='0';const btn=document.createElement('button');btn.className='wide';btn.textContent=p.complete?'実績を更新（完了済み）':'営業実績を登録して完了';btn.onclick=()=>{const h=Number(hr.value),m=Number(mi.value),r=Number(revenue.value);if(!Number.isInteger(h)||h<0||h>48||!Number.isInteger(m)||m<0||m>59||!Number.isFinite(r)||r<0){alert('営業時間・営業収入を確認してください');return}p.workMinutes=h*60+m;p.revenue=r;p.complete=true;save();closePanel();render();showInitial()};b.append(btn)}
function showToast(msg,canUndo){clearTimeout(toastTimer);$('toastText').textContent=msg;$('undoBtn').style.display=canUndo?'':'none';$('toast').classList.add('show');toastTimer=setTimeout(()=>{$('toast').classList.remove('show');undo=null},6500)}$('deleteBtn').onclick=()=>{const p=get(),i=p?.items.findIndex(x=>x.id===active);if(i==null||i<0)return;undo={day:chosen,item:p.items[i]};p.items.splice(i,1);active=null;save();render();showToast('予定を削除しました',true)};$('undoBtn').onclick=()=>{if(undo){(plans[undo.day]||ensure()).items.push(undo.item);save();undo=null;render();$('toast').classList.remove('show')}};$('eventBtn').onclick=()=>openPanel('events');$('recordBtn').onclick=()=>openPanel('record');$('calendarBtn').onclick=()=>openPanel('calendar');$('menuBtn').onclick=()=>openPanel('menu');$('closePanel').onclick=closePanel;ensure();render();setTimeout(showInitial,20);
})();</script></body></html>
